name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - run: npm run proof -- /tmp/proof
      - run: npm run mutate
      - run: npm run soak -- --seed 7 --nights 10 --out /tmp/soak.json
      - run: node src/headless/cli.js --seed 1 --night 3 --ticks 600 --out /tmp/smoke.jsonl && tail -n 1 /tmp/smoke.jsonl
  ui:
    runs-on: ubuntu-latest
    continue-on-error: true # bot trình duyệt và benchmark phụ thuộc môi trường đồ họa của runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run smoke
        env: { BROWSER: /usr/bin/google-chrome }
      - run: npm run bench -- --seed 42 --duration 5 --out /tmp/bench.json --headless
        env: { BROWSER: /usr/bin/google-chrome }